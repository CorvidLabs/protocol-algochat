<!-- Mermaid: kramdown renders ```mermaid fences as div.language-mermaid; turn them into diagrams. -->
<style>
  pre.mermaid {
    background: #ffffff;
    color: #1f2328;
    border-radius: 6px;
    padding: 16px;
    overflow-x: auto;
    text-align: center;
  }
</style>
<script type="module">
  const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
  if (blocks.length > 0) {
    for (const block of blocks) {
      const target = block.matches("code") ? block.parentElement : block;
      const diagram = document.createElement("pre");
      diagram.className = "mermaid";
      diagram.textContent = block.textContent;
      target.replaceWith(diagram);
    }
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    // The theme column is narrow: keep diagrams at natural size and let the box scroll sideways.
    const natural = { useMaxWidth: false };
    mermaid.initialize({
      startOnLoad: false,
      theme: "neutral",
      flowchart: natural,
      sequence: natural,
      class: natural,
      state: natural,
      er: natural,
    });
    await mermaid.run({ querySelector: "pre.mermaid" });
  }
</script>
